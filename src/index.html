<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyShot</title>
    <link rel="icon" type="image/png" href="/assets/keyshot.png">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="/main.js"></script>
</head>
<body>
    <main class="app">
        <header>
            <h1>KeyShot</h1>
            <p><i><b>Turn your keyboard into a weapon.</b></i></p>
        </header>

        <section class="status" id="status" role="status">
            <span class="status-dot"></span>
            <span id="status-text">ACTIVE</span>
        </section>

        <section class="controls">
            <div class="control-group">
                <label for="enabled">
                    <input type="checkbox" id="enabled" checked>
                    Enable keyboard sounds
                </label>
            </div>
            <div class="control-group">
                <label for="weapon">Sound effect</label>
                <select id="weapon">
                    <option value="machinegun">Machine Gun</option>
                    <option value="shotgun1">Shotgun 1</option>
                    <option value="shotgun2">Shotgun 2</option>
                    <option value="pistol">Pistol</option>
                    <option value="suppressed">Suppressed Pistol</option>
                    <option value="knife">Sword Slash</option>
                    <option value="laser">Laser Blaster</option>
                    <option value="coin">Coin Pickup</option>
                    <option value="powerup">Power-Up</option>
                    <option value="boing">Cartoon Boing</option>
                    <option value="levelup">Level-Up Chime</option>
                    <option value="keyboard">Mechanical Keyboard</option>
                    <option value="jump">8-Bit Jump</option>
                </select>
            </div>

            <div class="control-group">
                <label for="volume">
                    Volume: <span id="volume-value">50%</span>
                </label>
                <input type="range" id="volume" min="0" max="100" value="50">
            </div>
        </section>

        <button id="test-fire" type="button">TEST FIRE 🔥</button>
        <p class="hint">Press any key on your keyboard to fire.</p>
    </main>
</body>
</html>
